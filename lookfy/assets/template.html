<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" type="image/svg+xml" href="__FAVICON__">
__METAS__
<style>
:root{--bg:#f6f7f9;--fg:#1d2433;--sub:#5b6475;--card:#fff;--line:#d9dde4;--acc:#2f6fed;--rec:#0a7d3e;--recbg:#e3f5ea;--th:#f1f3f6;--m-bg:#ffffff;--m-bar:#f1f3f6;--m-item:#f4f5f7;--m-fg:#1d2433;--m-sub:#7a8292;--m-acc:#2f6fed;--m-onacc:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--fg:#e7eaf0;--sub:#a3abb9;--card:#1b1f27;--line:#333a46;--acc:#7aa5ff;--rec:#6fdc9b;--recbg:#143322;--th:#262c37;--m-bg:#1f242d;--m-bar:#262c37;--m-item:#2a303b;--m-fg:#e7eaf0;--m-sub:#9aa3b2;--m-acc:#5b8dff;--m-onacc:#fff}}
/* ---- lookfy assets/focus-points.css ---- */
__FP_CSS__
/* ---- lookfy assets/mockup-picker.css ---- */
__MP_CSS__
/* ---- 문서 레이아웃 ---- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px 16px 32px}
h1{font-size:24px;line-height:1.35;margin:0 0 4px}h2{font-size:19px;margin:32px 0 10px}h3{font-size:17px;margin:0;line-height:1.35}
a{color:var(--acc)}
.sub{color:var(--sub);margin:0 0 16px;font-size:14px;overflow-wrap:anywhere}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.sum ul{margin:6px 0 0;padding-left:20px}
.toc{display:flex;flex-wrap:wrap;gap:6px 12px;margin:14px 0 0;font-size:14px}
.legend{font-size:13px;color:var(--sub);margin:8px 0 0}
.badge{display:inline-block;font-size:12px;line-height:1;padding:4px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.badge.rec{background:var(--recbg);color:var(--rec);border-color:transparent;font-weight:700}
.badge.u{background:#fff4d6;color:#7a5200;border-color:transparent}.badge.p{background:#e8efff;color:#1e47a8;border-color:transparent}
.badge.dir{white-space:normal;line-height:1.35;color:var(--sub)}
@media (prefers-color-scheme:dark){.badge.u{background:#3a2f12;color:#ffd77a}.badge.p{background:#1c2a4a;color:#a9c3ff}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--th);white-space:nowrap}tr:last-child td{border-bottom:0}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start;scroll-margin-top:12px}
.grid.many{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.grid.many .card{grid-template-columns:minmax(0,1fr);gap:12px}
.grid.many .fp-stage{max-width:240px;margin:0 auto;width:100%}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.no{font-weight:800;color:var(--acc);font-size:18px}
.concept{margin:2px 0 8px;color:var(--sub)}
.feat{margin:0 0 8px;padding-left:18px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.pc div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}.pc b{display:block;font-size:13px;color:var(--sub)}.pc ul{margin:0;padding-left:16px}
.grid.many .pc{grid-template-columns:1fr}
.fp-stage{border-radius:14px;border:1px solid var(--line);max-width:300px;background:var(--m-bg)}
.label{font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 0}
.pts{margin:4px 0 0;padding-left:20px}
.m-bg{fill:var(--m-bg)}.m-bar{fill:var(--m-bar)}.m-item{fill:var(--m-item)}.m-fg{fill:var(--m-fg)}.m-sub{fill:var(--m-sub)}.m-acc{fill:var(--m-acc)}.m-on{fill:var(--m-onacc)}.m-line{stroke:var(--m-sub);fill:none}.m-stroke{stroke:var(--m-acc);fill:none}
svg text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
footer{margin-top:28px;color:var(--sub);font-size:13px;overflow-wrap:anywhere}
code{overflow-wrap:anywhere;font-size:13px}
@media (max-width:720px){.card{grid-template-columns:minmax(0,1fr)}.fp-stage{margin:0 auto;width:100%}.pc{grid-template-columns:1fr}}
</style></head><body><main>
